<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Shooter 2D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #000428 0%, #004e92 100%);
      overflow: hidden;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
    
    .score-display {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 24px;
      color: #00ff00;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff00;
      z-index: 100;
    }
    
    .health-display {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 24px;
      color: #ff0000;
      font-weight: bold;
      text-shadow: 0 0 10px #ff0000;
      z-index: 100;
    }
    
    .wave-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      color: #ffff00;
      font-weight: bold;
      text-shadow: 0 0 20px #ffff00;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    
    .wave-display.show {
      opacity: 1;
    }
    
    .game-over {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      color: white;
      z-index: 200;
      display: none;
      min-width: 300px;
    }
    
    .game-over h1 {
      font-size: 48px;
      color: #ff0000;
      margin-bottom: 20px;
    }
    
    .game-over p {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .game-over button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      background: #00ff00;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .game-over button:hover {
      background: #00dd00;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <div class="score-display">Score: <span id="score">0</span></div>
      <div class="health-display">❤️ <span id="health">3</span></div>
      <div class="wave-display" id="waveDisplay">Wave <span id="waveNum">1</span></div>
      <div class="game-over" id="gameOver">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Waves: <span id="finalWave">1</span></p>
        <button onclick="location.reload()">Spielen</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let score = 0;
    let health = 3;
    let wave = 1;
    let gameOver = false;
    
    // Player
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      width: 40,
      height: 40,
      speed: 6,
      bullets: []
    };
    
    // Enemies
    let enemies = [];
    let spawnRate = 2000;
    let lastSpawn = 0;
    
    // Touch controls
    let touchX = null;
    let isTouching = false;
    
    canvas.addEventListener('touchstart', (e) => {
      isTouching = true;
      touchX = e.touches[0].clientX;
    });
    
    canvas.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      touchX = e.touches[0].clientX;
    });
    
    canvas.addEventListener('touchend', () => {
      isTouching = false;
      touchX = null;
    });
    
    // Mouse controls
    let mouseX = null;
    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
    });
    
    canvas.addEventListener('mousedown', () => {
      shoot();
    });
    
    canvas.addEventListener('click', () => {
      shoot();
    });
    
    // Keyboard controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        shoot();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });
    
    // Enemy class
    class Enemy {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.speed = Math.random() * 2 + 1;
        this.health = 1;
      }
      
      update() {
        this.y += this.speed;
      }
      
      draw() {
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.strokeStyle = '#ff6666';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);
      }
      
      isOffScreen() {
        return this.y > canvas.height;
      }
    }
    
    // Bullet class
    class Bullet {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 5;
        this.height = 15;
        this.speed = 8;
      }
      
      update() {
        this.y -= this.speed;
      }
      
      draw() {
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
      
      isOffScreen() {
        return this.y < 0;
      }
    }
    
    function shoot() {
      const bullet = new Bullet(player.x + player.width / 2 - 2.5, player.y);
      player.bullets.push(bullet);
    }
    
    function updatePlayerPosition() {
      if (keys['ArrowLeft'] || keys['a']) {
        player.x -= player.speed;
      }
      if (keys['ArrowRight'] || keys['d']) {
        player.x += player.speed;
      }
      
      if (touchX !== null) {
        const targetX = touchX - canvas.getBoundingClientRect().left;
        const diff = targetX - (player.x + player.width / 2);
        if (Math.abs(diff) > 10) {
          player.x += (diff > 0 ? player.speed : -player.speed);
        }
      }
      
      if (mouseX !== null) {
        const targetX = mouseX - canvas.getBoundingClientRect().left;
        const diff = targetX - (player.x + player.width / 2);
        if (Math.abs(diff) > 10) {
          player.x += (diff > 0 ? player.speed : -player.speed);
        }
      }
      
      // Boundary check
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    }
    
    function spawnEnemy() {
      const x = Math.random() * (canvas.width - 30);
      enemies.push(new Enemy(x, -30));
    }
    
    function checkCollisions() {
      // Bullets hit enemies
      for (let i = player.bullets.length - 1; i >= 0; i--) {
        const bullet = player.bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          
          if (bullet.x < enemy.x + enemy.width &&
              bullet.x + bullet.width > enemy.x &&
              bullet.y < enemy.y + enemy.height &&
              bullet.y + bullet.height > enemy.y) {
            
            score += 10;
            document.getElementById('score').textContent = score;
            player.bullets.splice(i, 1);
            enemies.splice(j, 1);
            break;
          }
        }
      }
      
      // Enemies hit player
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (enemy.x < player.x + player.width &&
            enemy.x + enemy.width > player.x &&
            enemy.y < player.y + player.height &&
            enemy.y + enemy.height > player.y) {
          
          health--;
          document.getElementById('health').textContent = health;
          enemies.splice(i, 1);
          
          if (health <= 0) {
            endGame();
          }
        }
      }
    }
    
    function updateWave() {
      if (enemies.length === 0 && Date.now() - lastSpawn > 1000) {
        wave++;
        spawnRate = Math.max(800, spawnRate - 100);
        
        const waveDisplay = document.getElementById('waveDisplay');
        document.getElementById('waveNum').textContent = wave;
        waveDisplay.classList.add('show');
        
        setTimeout(() => {
          waveDisplay.classList.remove('show');
        }, 1000);
      }
    }
    
    function endGame() {
      gameOver = true;
      document.getElementById('gameOver').style.display = 'block';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalWave').textContent = wave;
    }
    
    function update() {
      if (gameOver) return;
      
      updatePlayerPosition();
      
      // Spawn enemies
      if (Date.now() - lastSpawn > spawnRate) {
        spawnEnemy();
        lastSpawn = Date.now();
      }
      
      // Update bullets
      for (let i = player.bullets.length - 1; i >= 0; i--) {
        player.bullets[i].update();
        if (player.bullets[i].isOffScreen()) {
          player.bullets.splice(i, 1);
        }
      }
      
      // Update enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        enemies[i].update();
        if (enemies[i].isOffScreen()) {
          health--;
          document.getElementById('health').textContent = health;
          enemies.splice(i, 1);
          
          if (health <= 0) {
            endGame();
          }
        }
      }
      
      checkCollisions();
      updateWave();
    }
    
    function draw() {
      // Clear canvas
      ctx.fillStyle = 'rgba(0, 4, 40, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw player
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      
      // Draw player cockpit
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(player.x + 15, player.y - 10, 10, 10);
      
      // Draw bullets
      player.bullets.forEach(bullet => bullet.draw());
      
      // Draw enemies
      enemies.forEach(enemy => enemy.draw());
      
      // Draw stars (background effect)
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 10; i++) {
        const x = (Date.now() / 50 + i * 100) % canvas.width;
        const y = (i * canvas.height / 10) % canvas.height;
        ctx.fillRect(x, y, 2, 2);
      }
    }
    
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    // Handle window resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      player.y = canvas.height - 50;
    });
    
    // Start game
    gameLoop();
  </script>
</body>
</html>
