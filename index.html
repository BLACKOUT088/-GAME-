<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Splat Arena - 3D Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background: #000;
      font-family: Arial, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    .hud {
      position: fixed;
      color: white;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
      z-index: 100;
    }
    
    #health {
      top: 10px;
      left: 10px;
      width: 200px;
      height: 20px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #ff4444;
      border-radius: 5px;
      overflow: hidden;
    }
    
    #healthBar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ff0000);
      transition: width 0.1s;
    }
    
    #score {
      top: 10px;
      right: 10px;
      font-size: 20px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border: 2px solid #ffd700;
      border-radius: 5px;
    }
    
    #ammo {
      bottom: 70px;
      right: 10px;
      font-size: 16px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border: 2px solid #00ff00;
      border-radius: 5px;
    }
    
    .controls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      padding: 8px;
      border: 1px solid #00ff00;
      border-radius: 5px;
      font-size: 12px;
      max-width: 150px;
    }
    
    .mobile-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 2px solid #00ff00;
    }
    
    .joy-pad {
      width: 60px;
      height: 60px;
      background: rgba(0,255,0,0.2);
      border: 2px solid #00ff00;
      border-radius: 50%;
      position: relative;
      cursor: grab;
    }
    
    .joy-pad.active {
      background: rgba(0,255,0,0.5);
    }
    
    .joy-stick {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #00ff00;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: grabbing;
    }
    
    .btn-shoot, .btn-reload, .btn-jump {
      width: 50px;
      height: 50px;
      border: 2px solid #00ff00;
      background: rgba(0,255,0,0.2);
      color: #0f0;
      border-radius: 5px;
      font-size: 24px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .btn-shoot:active, .btn-reload:active, .btn-jump:active {
      background: rgba(0,255,0,0.6);
    }
    
    @media (min-width: 1024px) {
      .mobile-controls { display: none; }
      .controls { display: block; }
    }
    
    @media (max-width: 1024px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="health" class="hud"><div id="healthBar"></div></div>
  <div id="score" class="hud">Score: 0</div>
  <div id="ammo" class="hud">Ammo: 100</div>
  <div class="controls">
    <b>Desktop:</b><br>
    WASD - Move<br>
    Mouse - Look<br>
    Click - Shoot<br>
    R - Reload
  </div>
  
  <div class="mobile-controls" id="mobileControls">
    <div class="joy-pad" id="joypad">
      <div class="joy-stick"></div>
    </div>
    <button class="btn-shoot" id="shootBtn">🎯</button>
    <button class="btn-reload" id="reloadBtn">⚡</button>
    <button class="btn-jump" id="jumpBtn">⬆️</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>

  <script>
    // Game Setup
    const canvas = document.getElementById('gameCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const world = new CANNON.World();
    world.gravity.set(0, -10, 0);

    let keys = {};
    let gameRunning = true;
    let score = 0;
    let playerHealth = 100;
    
    // Mobile input
    let touchX = 0, touchY = 0;
    
    const joypad = document.getElementById('joypad');
    const joystick = joypad.querySelector('.joy-stick');
    let joystickActive = false;
    
    joypad.addEventListener('touchstart', e => {
      e.preventDefault();
      joystickActive = true;
      joypad.classList.add('active');
    });
    
    joypad.addEventListener('touchmove', e => {
      if (!joystickActive) return;
      const touch = e.touches[0];
      const rect = joypad.getBoundingClientRect();
      const x = touch.clientX - rect.left - rect.width/2;
      const y = touch.clientY - rect.top - rect.height/2;
      const dist = Math.sqrt(x*x + y*y);
      const max = rect.width/2 - 15;
      if (dist > max) {
        const ratio = max / dist;
        touchX = x * ratio;
        touchY = y * ratio;
      } else {
        touchX = x;
        touchY = y;
      }
      joystick.style.transform = `translate(calc(-50% + ${touchX}px), calc(-50% + ${touchY}px))`;
    });
    
    joypad.addEventListener('touchend', e => {
      e.preventDefault();
      joystickActive = false;
      joypad.classList.remove('active');
      touchX = 0;
      touchY = 0;
      joystick.style.transform = 'translate(-50%, -50%)';
    });

    // Buttons
    document.getElementById('shootBtn').addEventListener('touchstart', e => {
      e.preventDefault();
      if (player) player.weapon.shoot();
    });
    
    document.getElementById('reloadBtn').addEventListener('touchstart', e => {
      e.preventDefault();
      if (player) player.weapon.reload();
    });
    
    document.getElementById('jumpBtn').addEventListener('touchstart', e => {
      e.preventDefault();
      if (player) player.jump();
    });

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(50, 50, 50);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // Ground
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2a2a3e });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // Walls
    [
      {x: 0, z: -100, w: 200, h: 30, d: 5},
      {x: 0, z: 100, w: 200, h: 30, d: 5},
      {x: -100, z: 0, w: 5, h: 30, d: 200},
      {x: 100, z: 0, w: 5, h: 30, d: 200}
    ].forEach(w => {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(w.w, w.h, w.d),
        new THREE.MeshLambertMaterial({ color: 0x505080 })
      );
      wall.position.set(w.x, w.h/2, w.z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      
      const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w.w/2, w.h/2, w.d/2)) });
      body.position.set(w.x, w.h/2, w.z);
      world.addBody(body);
    });

    class Player {
      constructor() {
        this.pos = new THREE.Vector3(0, 5, 0);
        this.vel = new THREE.Vector3();
        this.health = 100;
        this.yaw = 0;
        this.pitch = 0;
        this.grounded = false;
        
        const shape = new CANNON.Sphere(0.5);
        this.body = new CANNON.Body({ mass: 1, shape });
        this.body.position.set(0, 5, 0);
        world.addBody(this.body);
        
        this.weapon = new Weapon();
      }
      
      jump() {
        if (this.grounded) {
          this.vel.y = 10;
          this.grounded = false;
        }
      }
      
      update() {
        let mx = 0, mz = 0;
        if (keys['w']) mz -= 1;
        if (keys['s']) mz += 1;
        if (keys['a']) mx -= 1;
        if (keys['d']) mx += 1;
        
        mx += touchX / 30;
        mz -= touchY / 30;
        
        if (mx !== 0 || mz !== 0) {
          const dir = new THREE.Vector3(mx, 0, mz).normalize();
          dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
          this.vel.x = dir.x * 0.3;
          this.vel.z = dir.z * 0.3;
        } else {
          this.vel.x *= 0.8;
          this.vel.z *= 0.8;
        }
        
        if (keys[' '] && this.grounded) this.jump();
        
        this.vel.y -= 0.15;
        this.pos.add(this.vel);
        
        if (this.pos.y < 1) {
          this.pos.y = 1;
          this.vel.y = 0;
          this.grounded = true;
        } else {
          this.grounded = false;
        }
        
        this.pos.x = Math.max(-95, Math.min(95, this.pos.x));
        this.pos.z = Math.max(-95, Math.min(95, this.pos.z));
        
        this.body.position.copy(this.pos);
        camera.position.set(this.pos.x, this.pos.y + 1.5, this.pos.z);
        camera.rotation.set(this.pitch, this.yaw, 0, 'YXZ');
        
        this.weapon.update();
      }
      
      damage(amt) {
        this.health = Math.max(0, this.health - amt);
        document.getElementById('healthBar').style.width = this.health + '%';
        if (this.health <= 0) {
          this.health = 100;
          this.pos.set(0, 5, 0);
          this.vel.set(0, 0, 0);
          document.getElementById('healthBar').style.width = '100%';
        }
      }
    }

    class Weapon {
      constructor() {
        this.ammo = 100;
        this.cooldown = 0;
      }
      
      shoot() {
        if (this.ammo <= 0 || this.cooldown > 0) return;
        this.ammo--;
        this.cooldown = 0.1;
        
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
        const bullet = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0x00ff00 })
        );
        bullet.position.copy(camera.position);
        bullet.vel = dir.multiplyScalar(1.5);
        bullet.life = 100;
        scene.add(bullet);
        bullets.push(bullet);
        
        document.getElementById('ammo').textContent = 'Ammo: ' + this.ammo;
      }
      
      reload() {
        this.ammo = 100;
        document.getElementById('ammo').textContent = 'Ammo: 100';
      }
      
      update() {
        this.cooldown = Math.max(0, this.cooldown - 0.016);
      }
    }

    class Enemy {
      constructor(x, z) {
        this.pos = new THREE.Vector3(x, 1.5, z);
        this.health = 30;
        this.mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 1.5, 1.5),
          new THREE.MeshLambertMaterial({ color: 0xff6b6b })
        );
        this.mesh.position.copy(this.pos);
        this.mesh.castShadow = true;
        this.mesh.receiveShadow = true;
        scene.add(this.mesh);
      }
      
      update(target) {
        const dir = new THREE.Vector3().subVectors(target, this.pos).normalize();
        const dist = target.distanceTo(this.pos);
        if (dist > 2) this.pos.add(dir.multiplyScalar(0.12));
        if (dist < 3) player.damage(0.05);
        this.mesh.position.copy(this.pos);
      }
      
      hit(dmg) {
        this.health -= dmg;
        if (this.health <= 0) return false;
        return true;
      }
    }

    let player = new Player();
    let bullets = [];
    let enemies = [];
    
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      enemies.push(new Enemy(Math.cos(angle) * 50, Math.sin(angle) * 50));
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.vel);
        b.life--;
        
        let hit = false;
        for (let j = 0; j < enemies.length; j++) {
          if (b.position.distanceTo(enemies[j].pos) < 2) {
            if (!enemies[j].hit(10)) {
              scene.remove(enemies[j].mesh);
              enemies.splice(j, 1);
              score += 100;
              document.getElementById('score').textContent = 'Score: ' + score;
              const angle = Math.random() * Math.PI * 2;
              enemies.push(new Enemy(Math.cos(angle) * 50, Math.sin(angle) * 50));
            }
            scene.remove(b);
            bullets.splice(i, 1);
            hit = true;
            break;
          }
        }
        if (!hit && b.life <= 0) {
          scene.remove(b);
          bullets.splice(i, 1);
        }
      }
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousedown', () => player.weapon.shoot());
    window.addEventListener('mousemove', e => {
      player.yaw -= e.movementX * 0.005;
      player.pitch -= e.movementY * 0.005;
    });
    
    document.addEventListener('keydown', e => {
      if (e.key === 'r') player.weapon.reload();
    });
    
    document.addEventListener('click', () => document.body.requestPointerLock?.());

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      
      world.step(1/60);
      player.update();
      enemies.forEach(e => e.update(player.pos));
      updateBullets();
      
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
